version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 1.0.0 breaks the font API and unconditionally pulls vulnerable zip 0.6.6.
      # Reassess later releases after the upstream dependency is fixed.
      - dependency-name: figlet-rs
        versions: ['=1.0.0']
    groups:
      cargo-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
