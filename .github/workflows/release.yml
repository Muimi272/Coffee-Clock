name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Check version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match tag to Cargo version
        run: >-
          python3 -c 'import os, tomllib; version = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Tag must match Cargo.toml version"'

  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [version, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: coffee
            asset_name: coffee-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: coffee.exe
            asset_name: coffee-windows-amd64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: coffee
            asset_name: coffee-macos-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: coffee
            asset_name: coffee-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build Release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Release (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p package/docs package/assets/fonts package/examples
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} package/
          cp README.md LICENSE CONTRIBUTING.md CHANGELOG.md package/
          cp docs/RELEASE.md docs/README.zh-CN.md package/docs/
          cp assets/fonts/LICENSE package/assets/fonts/
          cp examples/config.toml package/examples/
          tar -czf ${{ matrix.asset_name }}.tar.gz -C package .

      - name: Package Release (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path package/docs, package/assets/fonts, package/examples
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.artifact_name }} package/
          Copy-Item README.md, LICENSE, CONTRIBUTING.md, CHANGELOG.md package/
          Copy-Item docs/RELEASE.md, docs/README.zh-CN.md package/docs/
          Copy-Item assets/fonts/LICENSE package/assets/fonts/
          Copy-Item examples/config.toml package/examples/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.asset_name }}.zip

      - name: Verify archive (Linux / macOS)
        if: matrix.os != 'windows-latest'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir smoke
          tar -xzf ${{ matrix.asset_name }}.tar.gz -C smoke
          for file in README.md CONTRIBUTING.md LICENSE assets/fonts/LICENSE docs/RELEASE.md docs/README.zh-CN.md examples/config.toml CHANGELOG.md; do
            test -s "smoke/$file"
          done
          expected=$(printf 'Coffee Clock - %s\nBy Muimi' "${RELEASE_TAG#v}")
          test "$(./smoke/coffee --version)" = "$expected"
          ./smoke/coffee --help

      - name: Verify archive (Windows)
        if: matrix.os == 'windows-latest'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Expand-Archive -LiteralPath ${{ matrix.asset_name }}.zip -DestinationPath smoke
          foreach ($file in @('README.md', 'CONTRIBUTING.md', 'LICENSE', 'assets/fonts/LICENSE', 'docs/RELEASE.md', 'docs/README.zh-CN.md', 'examples/config.toml', 'CHANGELOG.md')) {
            if (!(Test-Path -LiteralPath "smoke/$file")) { throw "Missing archive file: $file" }
            if ((Get-Item -LiteralPath "smoke/$file").Length -eq 0) { throw "Empty archive file: $file" }
          }
          $version = ./smoke/coffee.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged executable failed' }
          if (($version -join "`n") -cne "Coffee Clock - $($env:RELEASE_TAG.Substring(1))`nBy Muimi") { throw "Wrong packaged version: $version" }
          ./smoke/coffee.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged help failed' }

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate archive checksums
        working-directory: artifacts
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          sha256sum -- coffee-linux-amd64.tar.gz coffee-windows-amd64.zip coffee-macos-amd64.tar.gz coffee-macos-arm64.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: docs/RELEASE.md
          generate_release_notes: false
