[package]
name = "coffee"
version = "0.2.0"
edition = "2024"
description = "A terminal countdown and Pomodoro timer with FIGlet art"
license = "MIT"
repository = "https://github.com/Muimi272/Coffee-Clock"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"
figlet-rs = "0.1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"
